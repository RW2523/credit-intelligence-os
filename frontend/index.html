<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KT Credit Intelligence OS</title>
<meta name="color-scheme" content="dark light"/>
<script>
  // Set the theme before the stylesheet paints, so a reload in light mode never flashes dark.
  (function () {
    var t;
    try { t = localStorage.getItem('cios-theme'); } catch (e) { /* private mode */ }
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/styles.css"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d7cfe'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3ECI%3C/text%3E%3C/svg%3E"/>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<input id="uploader" type="file" hidden multiple accept=".pdf,.png,.jpg,.jpeg,.csv,.txt"/>
<script type="module" src="/app.js"></script>
</body>
</html>
