<meta name="color-scheme" content="dark light"/>
<meta name="theme-color" content="#0c2f22"/>
<script>
  // Set theme and language before the stylesheet paints, so a reload never flashes the wrong look.
  (function () {
    var t, l;
    try { t = localStorage.getItem('cios-theme'); l = localStorage.getItem('kt-lang'); } catch (e) { /* private mode */ }
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
    if (l === 'ms') document.documentElement.lang = 'ms';
  })();
</script>
